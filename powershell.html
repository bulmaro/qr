# PowerShell Quick Reference

Notation: `Verb-Noun` cmdlets are case-insensitive. `$_` is the current pipeline object.
Aliases are shown as `Get-ChildItem` / `gci`, `ls`, `dir`. Prefer full names in scripts,
aliases when typing interactively.

Applies to PowerShell 7+ (`pwsh`, cross-platform). Items limited to Windows PowerShell 5.1
(`powershell.exe`) or to 7-only features are marked.

---

## Most Common

| Command | Action |
|---|---|
| `Get-Help Get-Item -Full` | Full help for a cmdlet |
| `Get-Help Get-Item -Examples` | Just the examples |
| `Get-Command *service*` | Find cmdlets by name pattern |
| `Get-Member` / `gm` | List an object's properties and methods |
| `Get-ChildItem` / `ls`, `dir` | List files |
| `Set-Location ~/proj` / `cd` | Change directory |
| `Get-Content file.log` / `cat` | Print a file |
| `Get-Content -Tail 20 -Wait log` | Follow a file (like `tail -f`) |
| `Select-Object -First 5` | Take the first 5 objects |
| `Where-Object { $_.Size -gt 1MB }` / `?` | Filter |
| `ForEach-Object { $_.Name }` / `%` | Transform each item |
| `Sort-Object Length -Descending` | Sort |
| `Select-String 'error' *.log` / `sls` | grep |
| `$x = 42` | Assign a variable |
| `"Value is $x"` | Interpolating string (single quotes = literal) |
| `Get-Process \| Format-Table -AutoSize` | Readable table output |
| `Get-Process \| ConvertTo-Json` | Serialize to JSON |
| `$?` / `$LASTEXITCODE` | Last command succeeded / last native exit code |
| `Ctrl+C` | Cancel; `Ctrl+R` reverse-search history |
| `exit` | Leave the session |

## Help & Discovery

| Command | Action |
|---|---|
| `Update-Help` | Download help content (run once, elevated on Windows) |
| `Get-Help about_Splatting` | Conceptual topics — `Get-Help about_*` lists them |
| `Get-Help Get-Item -Online` | Open docs in a browser |
| `Get-Command -Module Microsoft.PowerShell.Management` | Everything in a module |
| `Get-Command -Verb Get -Noun Item` | Search by verb/noun |
| `(Get-Command ls).ResolvedCommand` | What does this alias point to? |

Tab-completion works on cmdlet names, parameters, enum values, and paths. `Ctrl+Space`
shows all completions as a menu.

## The Pipeline

PowerShell pipes **objects**, not text. That's the central difference from bash.

| Command | Action |
|---|---|
| `Where-Object { $_.Status -eq 'Running' }` | Filter with a script block |
| `Where-Object Status -eq 'Running'` | Simplified syntax (one comparison, no braces) |
| `ForEach-Object { $_ * 2 }` | Act on each object |
| `ForEach-Object -Parallel { ... } -ThrottleLimit 5` | Parallel (7+) |
| `Select-Object Name, Length` | Pick properties |
| `Select-Object -ExpandProperty Name` | Unwrap to raw values |
| `Select-Object -First 10 -Skip 5` | Slice |
| `Select-Object -Unique` | Dedupe |
| `Sort-Object Name, Length -Descending` | Multi-key sort |
| `Group-Object Extension` | Group into buckets |
| `Measure-Object Length -Sum -Average` | Aggregate |
| `Measure-Object` | Just count |
| `Tee-Object -FilePath out.txt` | Write to file and keep piping |
| `Out-Null` | Discard output |
| `$data \| Out-GridView -PassThru` | Interactive picker (Windows only) |

```powershell
# Ten largest files under the current tree
Get-ChildItem -Recurse -File |
  Sort-Object Length -Descending |
  Select-Object -First 10 Name, @{n='MB'; e={[math]::Round($_.Length/1MB, 2)}}
```

Calculated properties use a hashtable: `@{Name='MB'; Expression={ ... }}` (`n`/`e` for short).

## Files & Paths

| Command | Action |
|---|---|
| `Get-ChildItem -Recurse -Filter *.cs` | Recursive find by pattern |
| `Get-ChildItem -File` / `-Directory` | Only files / only dirs |
| `Get-ChildItem -Force` | Include hidden |
| `New-Item -ItemType Directory -Path a/b -Force` | mkdir -p |
| `New-Item -ItemType File x.txt` | touch |
| `Copy-Item src dst -Recurse` | cp -r |
| `Move-Item a b` | mv |
| `Remove-Item x -Recurse -Force` | rm -rf (**destructive**) |
| `Remove-Item x -WhatIf` | Dry run — shows what *would* happen |
| `Rename-Item old.txt new.txt` | Rename |
| `Test-Path ./file` | Does it exist? |
| `Resolve-Path ../x` | Expand to a full path |
| `Join-Path $HOME 'proj' 'src'` | Build a path portably |
| `Split-Path -Parent $p` / `-Leaf` | Dirname / basename |
| `Get-Item x \| Select-Object *` | All metadata for one item |
| `Set-Content f.txt 'hi'` | Overwrite file contents |
| `Add-Content f.txt 'more'` | Append |
| `Get-Content f.txt -Raw` | Read whole file as one string |
| `Get-Content f.txt -TotalCount 5` | First 5 lines (`head`) |
| `Get-FileHash f.zip -Algorithm SHA256` | Checksum |
| `Compress-Archive src out.zip` / `Expand-Archive` | Zip / unzip |

`-WhatIf` and `-Confirm` work on any cmdlet that changes state. Use `-WhatIf` before any
bulk `Remove-Item`.

## Text, Objects & Data Formats

| Command | Action |
|---|---|
| `Select-String 'TODO' -Path *.cs` | grep, returns match objects |
| `Select-String 'x' -Context 2,2` | With surrounding lines |
| `Select-String 'x' -NotMatch` | Invert (`grep -v`) |
| `Select-String 'x' -SimpleMatch` | Literal, no regex |
| `'a-b' -replace '-', '_'` | Regex replace |
| `'a,b,c' -split ','` | Split to array |
| `-join` | `('a','b') -join '-'` → `a-b` |
| `'Hello' -match '^H'` | Regex test; `$Matches` holds groups |
| `'abc'.Substring(1,2)`, `.ToUpper()`, `.Trim()` | .NET string methods |
| `ConvertTo-Json -Depth 5` / `ConvertFrom-Json` | JSON |
| `Import-Csv data.csv` / `Export-Csv out.csv -NoTypeInformation` | CSV |
| `ConvertFrom-StringData` | Parse `key=value` blocks |
| `Import-PowerShellDataFile x.psd1` | Read a `.psd1` data file |
| `ConvertTo-Xml`, `[xml](Get-Content f.xml)` | XML |
| `Format-Table -AutoSize`, `Format-List`, `Format-Wide` | Display shaping |
| `Out-String -Width 200` | Render objects to text |

`Format-*` cmdlets destroy the objects — always last in a pipeline, never before
`Where-Object` or `Export-Csv`.

## Variables, Types & Operators

```powershell
$name  = 'ada'                 # inferred
[int]$n = '42'                 # cast on assignment
$list  = 1, 2, 3               # array
$list  = @()                   # empty array
$map   = @{ a = 1; b = 2 }     # hashtable
$map.a; $map['b']              # both work
$ordered = [ordered]@{ ... }   # insertion-ordered
$obj = [pscustomobject]@{ Name = 'x'; Size = 10 }
```

| Operator | Meaning |
|---|---|
| `-eq -ne -gt -ge -lt -le` | Comparison (no `==`; `-eq` is case-insensitive on strings) |
| `-ceq -clike -cmatch` | Case-sensitive variants (`c` prefix) |
| `-like '*.txt'` / `-notlike` | Wildcard match |
| `-match` / `-notmatch` | Regex match, populates `$Matches` |
| `-replace 'a','b'` | Regex replace |
| `-contains` / `-in` | Collection membership (`$arr -contains 3`, `3 -in $arr`) |
| `-and -or -not -xor` | Logical |
| `-is [string]` / `-as [int]` | Type test / safe cast |
| `??` and `??=` | Null-coalescing (7+) |
| `?.` and `?[]` | Null-conditional access (7+) |
| `-f` | Format: `'{0:N2}' -f 3.14159` |
| `1KB 1MB 1GB 1TB 1PB` | Size literals |
| `$(...)` / `@(...)` | Subexpression / array subexpression |

Automatic variables: `$_` current object, `$PSItem` (same), `$?` last success,
`$LASTEXITCODE` native exit code, `$Error` error history, `$args` unnamed params,
`$PSScriptRoot` script's directory, `$PROFILE` profile path, `$HOME`, `$PWD`, `$null`,
`$true`, `$false`.

## Control Flow & Functions

```powershell
if ($n -gt 10) { 'big' } elseif ($n -gt 5) { 'mid' } else { 'small' }

switch ($x) {
  'a'          { 'letter a' }
  { $_ -gt 10 } { 'big'; break }
  default      { 'other' }
}
switch -Regex ($s) { '^\d+$' { 'numeric' } }

foreach ($item in $list) { $item }
for ($i = 0; $i -lt 5; $i++) { $i }
while ($true) { break }
do { $i++ } while ($i -lt 3)

1..5 | ForEach-Object { $_ }        # range
```

```powershell
function Get-Thing {
    [CmdletBinding()]
    param(
        [Parameter(Mandatory, ValueFromPipeline)]
        [string]$Name,

        [ValidateSet('dev','prod')]
        [string]$Stage = 'dev',

        [switch]$Force
    )
    begin   { $count = 0 }
    process { $count++; "$Name in $Stage" }
    end     { Write-Verbose "processed $count" }
}
```

`[CmdletBinding()]` gives you `-Verbose`, `-Debug`, `-ErrorAction`, and friends for free.
Splatting passes a hashtable as parameters:

```powershell
$params = @{ Path = './x'; Recurse = $true }
Get-ChildItem @params
```

## Errors & Debugging

| Command | Action |
|---|---|
| `try { } catch { $_ } finally { }` | Structured handling; `$_` is the ErrorRecord |
| `catch [System.IO.IOException] { }` | Typed catch |
| `-ErrorAction Stop` | Make a cmdlet's non-terminating error throw |
| `$ErrorActionPreference = 'Stop'` | Same, session-wide |
| `-ErrorVariable e` | Capture errors into `$e` without stopping |
| `$Error[0]` | Most recent error |
| `$_.Exception.Message`, `$_.ScriptStackTrace` | Error details |
| `throw 'message'` | Raise a terminating error |
| `Write-Error`, `Write-Warning`, `Write-Verbose`, `Write-Debug`, `Write-Host` | Output streams |
| `Set-PSBreakpoint -Script s.ps1 -Line 10` | Breakpoint |
| `Set-PSBreakpoint -Command Get-Item` | Break on a cmdlet call |
| `Set-StrictMode -Version Latest` | Error on undefined variables and bad property access |
| `Measure-Command { ... }` | Time a block |
| `2>&1`, `*> out.txt` | Redirect error stream / all streams |

Only `throw` and `-ErrorAction Stop` are catchable by `try/catch` — most cmdlet errors are
non-terminating by default and will sail past an empty `catch`.

Profile starter:

```powershell
Set-PSReadLineOption -PredictionSource History -EditMode Emacs
Set-PSReadLineKeyHandler -Key Tab -Function MenuComplete
Set-Alias g git
function gs { git status -sb }
$PSDefaultParameterValues['Out-File:Encoding'] = 'utf8'
```

## Execution Policy & Scripts (Windows)

| Command | Action |
|---|---|
| `Get-ExecutionPolicy -List` | Policy per scope |
| `Set-ExecutionPolicy RemoteSigned -Scope CurrentUser` | Common dev setting |
| `pwsh -File s.ps1` | Run a script |
| `pwsh -NoProfile -c 'Get-Date'` | One-liner, skip the profile |
| `pwsh -ExecutionPolicy Bypass -File s.ps1` | Bypass for one invocation |
| `Unblock-File s.ps1` | Clear the downloaded-from-internet mark |
| `. ./lib.ps1` | Dot-source: run in the current scope |
| `& './my script.ps1'` | Call operator — needed for quoted/variable paths |
| `#Requires -Version 7.0` | Guard at the top of a script |

Execution policy is not a security boundary — it's a guardrail against accidental
double-clicks. It doesn't exist on Linux/macOS.

## Coming From bash

| bash | PowerShell |
|---|---|
| `ls -la` | `Get-ChildItem -Force` |
| `cat f` | `Get-Content f` |
| `grep x f` | `Select-String x f` |
| `head -5` / `tail -5` | `-TotalCount 5` / `-Tail 5` |
| `tail -f` | `Get-Content -Wait` |
| `wc -l` | `(Get-Content f).Count` or `Measure-Object -Line` |
| `find . -name '*.cs'` | `Get-ChildItem -Recurse -Filter *.cs` |
| `sed 's/a/b/'` | `-replace 'a','b'` |
| `awk '{print $2}'` | `-split ' ' \| Select-Object -Index 1` |
| `cut -d, -f2` | `Import-Csv` then select the column |
| `sort -u` | `Sort-Object -Unique` |
| `xargs cmd` | `ForEach-Object { cmd $_ }` |
| `export X=1` | `$env:X = '1'` |
| `which cmd` | `Get-Command cmd` |
| `$?` (0 = ok) | `$?` is `$true`/`$false`; `$LASTEXITCODE` for native exit codes |
| `cmd1 && cmd2` | `cmd1 && cmd2` (7.3+) or `cmd1; if ($?) { cmd2 }` |
| `` `cmd` `` | `$(cmd)` |
| `man cmd` | `Get-Help cmd` |

Gotchas when crossing over:

- Piping to a native tool (`| grep`) sends *formatted text*, not objects — the layout may
  be truncated at your console width. Use `Out-String -Width 4096` first if you must.
- Bare `-` in native-command arguments is fine, but PowerShell parses `-Foo` as a
  parameter for cmdlets. Use `--%` to stop parsing: `curl --% -H "X: y" url`.
- A function returning a single-item collection unrolls to a scalar. Wrap with `@(...)`
  when you need an array guaranteed.
